<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI & Data Science Workshop Enrollment Form</title>
</head>
<body>

  <h3>Demo Form</h3>
  <h1>AI & Data Science Workshop Enrollment Form</h1>

  <form action="#" method="post" enctype="multipart/form-data">
    
    <label for="name">Student Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name"><br><br>

    <label for="mobile">Mobile Number:</label><br>
    <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number"><br><br>

    <label for="email">Contact Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email address"><br><br>

    <label for="dob">Birth Date:</label><br>
    <input type="date" id="dob" name="dob"><br><br>

    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male"> Male<br>
    <input type="radio" id="female" name="gender" value="Female"> Female<br>
    <input type="radio" id="other" name="gender" value="Other"> Other<br><br>

    <label for="program">Select Program:</label><br>
    <select id="program" name="program">
      <option>Artificial Intelligence</option>
      <option>Data Science</option>
      <option>Machine Learning</option>
      <option>Deep Learning</option>
    </select><br><br>

    <label for="qualification">Qualification:</label><br>
    <input type="text" id="qualification" name="qualification" placeholder="e.g., B.Tech, M.Sc"><br><br>

    <label for="institute">Institute Name:</label><br>
    <input type="text" id="institute" name="institute" placeholder="Enter your college name"><br><br>

    <label for="cv">Upload CV (PDF/DOC):</label><br>
    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx"><br><br>

    <input type="submit" value="Register">

  </form>

</body>
</html>
